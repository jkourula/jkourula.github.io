<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Object Synth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/object-synth/assets/index-CCiHks_l.js"></script>
  <link rel="stylesheet" crossorigin href="/object-synth/assets/index-D3CMDmua.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo">◉</span> Object Synth <span class="sub">physical drop synthesis</span></div>
      <div class="transport">
        <button id="btnDrop" class="primary" title="Simulate (Space)">▼ Drop</button>
        <button id="btnCancel" class="ghost" hidden>Cancel</button>
        <div class="progress"><div id="progBar"></div><span id="progText">ready</span></div>
        <label class="inline">Take
          <select id="takeMode"><option value="replace">replace</option><option value="append">append</option><option value="overlay">overlay</option></select>
        </label>
        <label class="inline"><input type="checkbox" id="autoPlay" checked /> auto replay</label>
        <label class="inline" title="Render a fast 48 kHz preview first, then the full-quality take in the background"><input type="checkbox" id="quickPreview" checked /> quick preview</label>
      </div>
      <div class="stats" id="stats"></div>
    </header>
    <aside id="left" class="panel"></aside>
    <main id="center">
      <div id="viewport">
        <div id="viewHud">
          <div class="hudrow">
            <button id="btnReplay" class="small">▶ Replay</button>
            <label class="inline">speed
              <select id="replaySpeed">
                <option value="1">1×</option><option value="0.5">½×</option><option value="0.25">¼×</option>
                <option value="0.125">⅛×</option><option value="0.0625">1/16×</option><option value="0.03125">1/32×</option>
              </select>
            </label>
            <label class="inline">vibration
              <input type="range" id="visGain" min="0" max="3" step="0.01" value="1" />
            </label>
            <span id="timeReadout" class="mono">0.000 s</span>
          </div>
          <div class="hint">Click the surface to set the drop point · drag to orbit · scroll to zoom</div>
        </div>
      </div>
      <div id="takeArea">
        <div class="takeHead">
          <span class="title">Take</span>
          <div class="seg" id="viewMode">
            <button data-v="wave" class="on">Waveform</button><button data-v="spec">Spectrogram</button>
          </div>
          <span class="mono dim" id="takeInfo">no take yet</span>
          <span class="spacer"></span>
          <button id="btnSelAll" class="small ghost">Select all</button>
          <button id="btnExportTake" class="small">Export take (32-bit float WAV)</button>
        </div>
        <canvas id="wave"></canvas>
      </div>
    </main>
    <aside id="right" class="panel"></aside>
  </div>
</body>
</html>
